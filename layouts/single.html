{{ define "main" }}
<article>
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    {{ if not .Date.IsZero }}
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time>
    {{ end }}
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ if eq .Section "wpisy" }}
<section class="comments">
  <h2>{{ i18n "comments" }}</h2>
  <div id="giscus-container"></div>
  <script>
    (function () {
      var dark = document.documentElement.dataset.theme === 'dark' ||
        (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
      var s = document.createElement('script');
      s.src = 'https://giscus.app/client.js';
      s.async = true;
      s.crossOrigin = 'anonymous';
      var cfg = {
        'data-repo': 'callimae/czaspopiolow',
        'data-repo-id': 'R_kgDOT3UDww',
        'data-category': 'Announcements',
        'data-category-id': 'DIC_kwDOT3UDw84DDT9Z',
        'data-mapping': 'pathname',
        'data-strict': '0',
        'data-reactions-enabled': '1',
        'data-emit-metadata': '0',
        'data-input-position': 'bottom',
        'data-theme': dark ? 'dark' : 'light',
        'data-lang': '{{ site.Language.Lang }}',
        'data-loading': 'lazy'
      };
      for (var k in cfg) s.setAttribute(k, cfg[k]);
      document.getElementById('giscus-container').appendChild(s);
    })();
  </script>
</section>
{{ end }}
{{ end }}
