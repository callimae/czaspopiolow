{{ define "main" }}
<ul class="post-list">
  {{ range where site.RegularPages "Section" "wpisy" }}
  <li class="post-item">
    <h2 class="post-item-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <time class="post-item-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time>
    <p class="post-item-summary">{{ .Summary | plainify }}</p>
  </li>
  {{ end }}
</ul>
{{ end }}
